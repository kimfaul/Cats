<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Flow</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc, #e6eef8);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #0f172a;
        }
        .card {
            max-width: 820px;
            width: 90%;
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(2,6,23,0.12);
            text-align: center;
        }
        h1 { margin: 0 0 12px; font-size: 1.6rem; }
        img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 12px auto; }
        p { margin: 12px 0 0; color: #334155; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Flow is the greatest movie ever made</h1>
        <img src="flow.png" alt="Flow poster"/>
        <p>That is all</p>
    </div>
</body>
</html>
